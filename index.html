<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南一國語一年級｜整課筆順練習</title><style>body{margin:0;background:#f8eee4;color:#493e35;font-family:system-ui,'Microsoft JhengHei',sans-serif}main{max-width:760px;margin:55px auto;padding:0 20px}h1{text-align:center;font-size:30px}.intro{text-align:center;color:#64717d;line-height:1.8}.panel{margin:30px auto;padding:28px;background:#fff8f1;border-radius:12px;text-align:center}label{display:block;margin-bottom:12px;font-weight:600}.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.lesson-card{border:2px solid #e8d4c2;background:white;color:#263645;border-radius:10px;padding:15px 8px;font-size:17px;font-weight:650;cursor:pointer}.lesson-card[aria-pressed="true"]{background:#f4d9c0;border-color:#c8895e;color:#75462d}.lesson-card:focus-visible{outline:3px solid #e7a64c;outline-offset:2px}.characters{font-size:30px;letter-spacing:9px;line-height:2;overflow-wrap:anywhere;margin:22px 0}.button{display:inline-block;border:0;border-radius:9px;background:#b77d57;color:#fff;font-size:20px;font-weight:700;padding:16px 25px;text-decoration:none;cursor:pointer}.button:hover{background:#966242}.note{font-size:14px;color:#677480;line-height:1.9;margin-top:30px}@media(max-width:520px){main{margin:25px auto}h1{font-size:24px}.panel{padding:18px}.characters{font-size:25px;letter-spacing:5px}.lesson-grid{gap:8px}.lesson-card{font-size:15px;padding:13px 5px}}</style></head><body><main><h1>✏️ 國字筆順練習</h1><p class="intro">南一版・一年級上學期<br>選擇課別，一次開啟整課生字的教育部筆順練習。</p><section class="panel"><div style="font-weight:700">📚 選擇課別</div><div class="lesson-grid" id="lessonGrid" role="group" aria-label="選擇課別"></div><div class="characters" id="characters"></div><a class="button" id="go" target="_blank" rel="noopener noreferrer">✍️ 全課筆順練習 ↗</a></section></main><script>const lessons=[["第一課・小船", "小上走左右向魚也來加"], ["第二課・印手印", "開出招車子地花朵在笑"], ["第三課・吹泡泡", "泡玩大起好多我的你抱"], ["第四課・你好", "爸到青叫下那和要他朋友"], ["第五課・外星人", "外住個們這裡有沒是什麼"], ["第六課・小金魚", "金說句話兩都悄尾巴滿紅"], ["第七課・紅紅的春", "春貼呢了請天家把不房福"]];let selectedLesson=0;const grid=document.querySelector('#lessonGrid'),chars=document.querySelector('#characters'),go=document.querySelector('#go');lessons.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='lesson-card';b.textContent=x[0];b.setAttribute('aria-pressed',String(i===0));b.addEventListener('click',()=>{selectedLesson=i;render()});grid.appendChild(b)});function render(){[...grid.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selectedLesson)));const [name,words]=lessons[selectedLesson];chars.textContent=[...words].join(' ');go.href='https://stroke-order.learningweb.moe.edu.tw/dictView.jsp?'+new URLSearchParams({ID:['23567','38283','27873','29240','22806','37329','26149'][selectedLesson],WORD:words,ID2:'1'});}render();
</script></body></html>
